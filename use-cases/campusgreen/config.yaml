# Agent Kernel local development configuration.
session:
  type: in_memory
  cache:
    size: 256

# WhatsApp messaging integration (used by server.py / integration_demo.py).
# Credentials are read from the environment (AK_WHATSAPP__*); only the agent
# name lives in this committed file.
whatsapp:
  agent: "campusgreen"

# REST API surface that hosts the WhatsApp webhook handler.
api:
  host: "0.0.0.0"
  port: 8000

logging:
  ak:
    level: INFO